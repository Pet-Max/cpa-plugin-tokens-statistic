name: "功能请求 / Feature Request"
description: "提议一个新功能或改进现有功能 / Suggest a new feature or improvement"
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: request
    attributes:
      label: "功能描述 / Feature description"
      description: "请说明你希望增加或改进什么功能 / Describe the feature you would like to add or improve"
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: "使用场景 / Use case"
      description: "请说明这个功能解决什么问题，以及为什么需要它 / Explain what problem this solves and why it is needed"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "建议方案 / Proposed solution"
      description: "如果有具体实现想法，请在这里描述 / Describe any specific implementation ideas"